name: Build macOS app

# Builds the macOS .app/.dmg on Apple hardware (GitHub's licensed Mac
# runners), since Apple's toolchain cannot run on Windows. Produces a
# UNIVERSAL binary (Apple Silicon + Intel in one app). The .app is zipped
# with ditto because upload-artifact alone strips the executable bit and a
# re-downloaded app then refuses to open.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci
        working-directory: nutq

      - name: Build universal app (Apple Silicon + Intel)
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg
        working-directory: nutq

      - name: Zip the app preserving Unix permissions
        run: |
          cd nutq/src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent nutq.app nutq-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nutq-macos
          path: |
            nutq/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            nutq/src-tauri/target/universal-apple-darwin/release/bundle/macos/nutq-macos.zip
          if-no-files-found: error
