<title>nutq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600&display=swap">

<style>
  /* A screen with a keyboard under it. The whole page is one loop: a key goes
     down, a voice is heard, the words end up in the chat. Nothing to click. */
  :root {
    --ink: #0d1117;
    --ink-2: #141a23;
    --line: #222b37;
    --text: #e8edf4;
    --muted: #93a1b3;

    --app: #ffffff;
    --app-2: #f1f4f8;
    --app-line: #e0e6ee;
    --app-text: #18202b;

    --key: #1b222c;
    --key-top: #232b37;
    --key-line: #2c3542;

    --accent: #2fd6a5;
    --accent-deep: #0f9d76;
    --rec: #ff6b6b;

    --display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
    --body: "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;

    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 52px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .ltr { direction: ltr; unicode-bidi: isolate; }

  .mast { display: flex; flex-direction: column; gap: 4px; }
  .mast h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: 26px;
  }
  .mast p { margin: 0; font-size: 15px; color: var(--muted); }

  /* ---------- the three beats, lit as the loop plays ---------- */

  .beats {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 14px;
    color: #5f6c7e;
  }
  .beat {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: color 0.3s;
  }
  .beat::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #333d4c;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .beat.on { color: var(--text); }
  .beat.on::before { background: var(--accent); box-shadow: 0 0 10px rgba(47, 214, 165, 0.75); }
  .beats .sep { color: #333d4c; }

  /* ---------- screen ---------- */

  .screen {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    padding: 30px 24px 66px;
    min-height: 400px;
    background:
      radial-gradient(120% 90% at 80% 6%, rgba(47, 214, 165, 0.13), transparent 58%),
      radial-gradient(110% 80% at 10% 100%, rgba(79, 120, 214, 0.15), transparent 60%),
      #0b1017;
    box-shadow: 0 26px 60px rgba(0, 0, 0, 0.5);
  }

  .win {
    max-width: 520px;
    margin: 0 auto;
    border-radius: 10px;
    overflow: hidden;
    background: var(--app);
    color: var(--app-text);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.5);
    color-scheme: light;
  }
  .titlebar {
    display: flex;
    align-items: center;
    height: 36px;
    padding-inline-end: 14px;
    background: var(--app-2);
    border-bottom: 1px solid var(--app-line);
  }
  .titlebar .name {
    margin-inline-start: auto;
    font-size: 13px;
    font-weight: 500;
    color: #667586;
  }
  .caption { display: flex; }
  .caption i {
    width: 40px; height: 36px;
    display: grid; place-items: center;
    font-family: var(--mono);
    font-size: 11px;
    font-style: normal;
    color: #8b98a8;
  }

  .thread {
    padding: 16px;
    min-height: 132px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .bubble {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .them {
    align-self: flex-start;
    background: var(--app-2);
    border-top-right-radius: 5px;
  }
  .them .who { display: block; font-size: 11px; color: #667586; margin-bottom: 2px; }
  .mine {
    align-self: flex-end;
    background: #d9f6ec;
    border-top-left-radius: 5px;
    opacity: 0;
    transform: translateY(8px) scale(0.97);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .mine.in { opacity: 1; transform: none; }
  .mine .tick { color: var(--accent-deep); font-size: 11px; margin-inline-start: 6px; }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 9px;
    padding: 11px;
    border-top: 1px solid var(--app-line);
    background: var(--app-2);
  }
  .field {
    flex: 1;
    min-height: 42px;
    padding: 10px 12px;
    border: 1px solid var(--accent-deep);
    border-radius: 10px;
    background: var(--app);
    font-size: 15px;
    line-height: 1.5;
    box-shadow: 0 0 0 3px rgba(47, 214, 165, 0.15);
  }
  .field .ph { color: #9aa7b6; }
  .caret {
    display: inline-block;
    width: 1.5px; height: 1.05em;
    background: var(--app-text);
    vertical-align: -0.16em;
    margin-inline-start: 1px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .send {
    height: 42px;
    padding: 0 16px;
    border: 1px solid var(--app-line);
    border-radius: 10px;
    background: var(--app);
    color: #97a3b2;
    font: inherit;
    font-size: 14px;
    transition: background 0.25s, color 0.25s, border-color 0.25s;
  }
  .send.ready { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }

  /* ---------- the overlay pill ---------- */

  .pill {
    position: absolute;
    inset-inline: 0;
    bottom: 20px;
    margin: 0 auto;
    width: fit-content;
    max-width: calc(100% - 48px);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    border: 1px solid #2b3542;
    border-radius: 999px;
    background: #171e28;
    box-shadow: 0 0 0 1px rgba(47, 214, 165, 0.12), 0 16px 40px rgba(0, 0, 0, 0.6);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .pill.in { opacity: 1; transform: none; }

  .bars { display: flex; align-items: center; gap: 3px; height: 20px; flex: none; }
  .bars i { width: 3px; height: 6px; border-radius: 2px; background: var(--rec); }
  .pill.in .bars i { animation: pulse 1s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: 0.1s; }
  .bars i:nth-child(3) { animation-delay: 0.2s; }
  .bars i:nth-child(4) { animation-delay: 0.3s; }
  .bars i:nth-child(5) { animation-delay: 0.4s; }
  .bars i:nth-child(6) { animation-delay: 0.5s; }
  @keyframes pulse {
    0%, 100% { height: 6px; opacity: 0.5; }
    50%      { height: 18px; opacity: 1; }
  }
  .heard {
    font-size: 14px;
    color: #cbd6e4;
    white-space: nowrap;
    overflow: hidden;
  }
  .heard .w { opacity: 0; animation: land 0.25s ease forwards; }
  @keyframes land { to { opacity: 1; } }

  /* ---------- keyboard under the screen ---------- */

  .keyboard {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: linear-gradient(#161d27, #10161e);
    overflow-x: auto;
  }
  .k {
    position: relative;
    flex: none;
    width: 54px;
    height: 46px;
    display: grid;
    place-items: center;
    border: 1px solid var(--key-line);
    border-bottom-width: 3px;
    border-radius: 8px;
    background: linear-gradient(var(--key-top), var(--key));
    font-family: var(--mono);
    font-size: 12px;
    color: #7d8a9c;
    transition: transform 0.09s ease, border-bottom-width 0.09s ease, color 0.2s, background 0.2s;
  }
  .k.f8 {
    color: var(--accent);
    border-color: var(--accent-deep);
    background: linear-gradient(#1d2b2b, #15211f);
  }
  .k.down {
    transform: translateY(2px);
    border-bottom-width: 1px;
    background: linear-gradient(#20342f, #182823);
  }
  /* the ring that leaves the key on each press */
  .k .ring {
    position: absolute;
    inset: -2px;
    border-radius: 10px;
    border: 1.5px solid var(--accent);
    opacity: 0;
    pointer-events: none;
  }
  .k.hit .ring { animation: ring 0.55s ease-out; }
  @keyframes ring {
    from { opacity: 0.9; transform: scale(1); }
    to   { opacity: 0; transform: scale(1.5); }
  }

  .foot {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }

  @media (max-width: 520px) {
    .k { width: 44px; height: 40px; font-size: 11px; }
    .keyboard { gap: 5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bars i, .caret, .k .ring { animation: none !important; }
    .bars i:nth-child(odd) { height: 14px; }
    .pill, .mine, .k { transition: none; }
    .heard .w { animation: none; opacity: 1; }
  }
</style>

<div class="page" dir="rtl" lang="ar">

  <div class="mast">
    <h1>nutq</h1>
    <p>اضغط <span class="ltr">F8</span>، احكي، والكلام بينكتب محلّ ما كان المؤشر.</p>
  </div>

  <div class="beats">
    <span class="beat" id="b1">اضغط <span class="ltr">F8</span></span>
    <span class="sep">←</span>
    <span class="beat" id="b2">احكي</span>
    <span class="sep">←</span>
    <span class="beat" id="b3">اضغط <span class="ltr">F8</span> والكلام بمحلّه</span>
  </div>

  <div class="screen">
    <div class="win">
      <div class="titlebar">
        <div class="caption" aria-hidden="true"><i>✕</i><i>▢</i><i>─</i></div>
        <span class="name">الرسائل</span>
      </div>

      <div class="thread">
        <div class="bubble them">
          <span class="who">سامر</span>
          وصلك الملف؟ محتاجه اليوم إذا بتقدر.
        </div>
        <div class="bubble mine" id="sent">
          <span id="sentText"></span><span class="tick">✓✓</span>
        </div>
      </div>

      <div class="composer">
        <div class="field"><span class="ph" id="ph">اكتب رسالة…</span><span id="typed"></span><span class="caret" aria-hidden="true"></span></div>
        <span class="send" id="send">إرسال</span>
      </div>
    </div>

    <div class="pill" id="pill" aria-hidden="true">
      <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="heard" id="heard"></div>
    </div>
  </div>

  <div class="keyboard" aria-hidden="true">
    <div class="k">F5</div>
    <div class="k">F6</div>
    <div class="k">F7</div>
    <div class="k f8" id="key">F8<span class="ring"></span></div>
    <div class="k">F9</div>
    <div class="k">F10</div>
    <div class="k">F11</div>
  </div>

  <p class="foot">بيشتغل بأي مكان بالويندوز — شات، إيميل، محرّر كود. الصوت بيضل بالذاكرة وما بينحفظ على القرص.</p>

</div>

<script>
  (function () {
    var key = document.getElementById("key");
    var pill = document.getElementById("pill");
    var heard = document.getElementById("heard");
    var typed = document.getElementById("typed");
    var ph = document.getElementById("ph");
    var send = document.getElementById("send");
    var sent = document.getElementById("sent");
    var sentText = document.getElementById("sentText");
    var beats = [document.getElementById("b1"), document.getElementById("b2"), document.getElementById("b3")];

    var WORDS = ["تمام،", "بكرا", "الصبح", "ببعتلك", "الملف"];
    var LINE = WORDS.join(" ");
    var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var timers = [];

    function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
    function lit(i) { beats.forEach(function (b, n) { b.classList.toggle("on", n === i); }); }

    function press() {
      key.classList.add("down", "hit");
      at(140, function () { key.classList.remove("down"); });
      at(600, function () { key.classList.remove("hit"); });
    }

    function rest() {
      /* the still frame: the message already sent, so a thumbnail shows the point */
      lit(2);
      ph.hidden = true;
      typed.textContent = "";
      sentText.textContent = LINE;
      sent.classList.add("in");
      send.classList.remove("ready");
    }

    function run() {
      timers.forEach(clearTimeout);
      timers = [];

      /* reset */
      pill.classList.remove("in");
      sent.classList.remove("in");
      send.classList.remove("ready");
      heard.textContent = "";
      typed.textContent = "";
      sentText.textContent = "";
      ph.hidden = false;
      lit(0);

      at(700, press);
      at(950, function () { lit(1); pill.classList.add("in"); });

      WORDS.forEach(function (w, i) {
        at(1250 + i * 420, function () {
          var s = document.createElement("span");
          s.className = "w";
          s.textContent = (i ? " " : "") + w;
          heard.appendChild(s);
        });
      });

      var spoken = 1250 + WORDS.length * 420;

      at(spoken + 250, press);
      at(spoken + 450, function () {
        pill.classList.remove("in");
        lit(2);
        ph.hidden = true;
        var i = 0;
        (function type() {
          typed.textContent = LINE.slice(0, ++i);
          if (i < LINE.length) at(20, type);
          else at(500, function () { send.classList.add("ready"); });
        })();
      });

      at(spoken + 2100, function () {
        typed.textContent = "";
        ph.hidden = false;
        send.classList.remove("ready");
        sentText.textContent = LINE;
        sent.classList.add("in");
      });

      at(spoken + 5200, run);
    }

    if (still) rest(); else run();
  })();
</script>
