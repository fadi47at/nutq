[package]
name = "nutq"
version = "0.1.1"
description = "Voice in, finished text out."
authors = ["Fadi"]
edition = "2021"

[lib]
name = "nutq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# audio capture
cpal = "0.15"
hound = "3"

# networking
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

base64 = "0.22"
anyhow = "1"
thiserror = "2"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }

# clipboard (save / set / restore around the paste)
arboard = "3"

# API keys go to the OS credential store, never to a plaintext file. The
# platform features are per-target: Windows Credential Manager, macOS Keychain.
# Desktop-only: a second launch must not spawn a second process (second tray
# icon, second overlay, dead hotkeys) - it has to hand off to the running one.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
core-graphics = "0.24"
# Transparent overlay windows are gated behind Apple's "private API" switch
# in Tauri; enabling it here keeps the Windows build untouched.
tauri = { version = "2", features = ["macos-private-api"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
